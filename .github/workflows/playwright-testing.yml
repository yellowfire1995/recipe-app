name: Playwright Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync API code to stack
        run: |
          rsync -av --exclude='.git' \
            ${{ github.workspace }}/api/ \
            /home/ubuntu/docker/cookbookcalc/recipe-app/api/

      - name: Sync frontend code to stack
        run: |
          rsync -av --exclude='.git' --exclude='node_modules' \
            ${{ github.workspace }}/recipe-app/ \
            /home/ubuntu/docker/cookbookcalc/recipe-app/recipe-app/

      - name: Rebuild and restart stack
        working-directory: /home/ubuntu/docker/cookbookcalc
        run: |
          docker compose -f docker-compose-dev.yml up -d --wait
          docker compose -f docker-compose-dev.yml up -d --force-recreate --no-deps --wait api frontend

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run Playwright tests
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BASE_URL: http://localhost:5173
        run: npx playwright test --project=dev --workers 2

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Restore stack to main on failure
        if: failure()
        run: |
          # Checkout main in the runner workspace
          git checkout main
          git pull origin main
          # Rsync main back to the stack
          rsync -av --exclude='.git' \
            ${{ github.workspace }}/api/ \
            /home/ubuntu/docker/cookbookcalc/recipe-app/api/
          rsync -av --exclude='.git' --exclude='node_modules' \
            ${{ github.workspace }}/recipe-app/ \
            /home/ubuntu/docker/cookbookcalc/recipe-app/recipe-app/
          cd /home/ubuntu/docker/cookbookcalc
          docker compose -f docker-compose-dev.yml up -d --force-recreate --no-deps api frontend --wait
