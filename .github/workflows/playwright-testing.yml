name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, vps]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync API code to stack
        run: |
          rsync -av --exclude='.git' \
            ${{ github.workspace }}/api/ \
            ~/docker/cookbookcalc/recipe-app/api/

      - name: Sync frontend code to stack
        run: |
          rsync -av --exclude='.git' --exclude='node_modules' \
            ${{ github.workspace }}/recipe-app/ \
            ~/docker/cookbookcalc/recipe-app/recipe-app/

      - name: Rebuild and restart stack
        working-directory: ~/cookbookcalc
        run: docker compose up -d --build --wait

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for stack to be healthy
        run: |
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'
          echo "Waiting for API..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        env:
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          BASE_URL: http://localhost:5173
        run: npx playwright test --project=dev

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Restore stack to main on failure
        if: failure()
        run: |
          cd ~/cookbookcalc && git checkout main
          docker compose up -d --build --wait